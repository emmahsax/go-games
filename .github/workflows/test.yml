name: Go Test

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Code
        uses: actions/checkout@v6

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang libc6-dev libgl1-mesa-dev xorg-dev

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26

      - name: Go Build
        run: go build -o bin/go-games .

      - name: Go Test
        run: go test -v ./...

      - name: Go Vet
        run: go vet -v ./...

      - name: Go FMT
        uses: emmahsax/github-actions/gofmt-check@main
        with:
          gofmt_flags: '-l -d'
          gofmt_path: ./

      - name: Go Staticcheck
        uses: dominikh/staticcheck-action@v1.4.1
        with:
          install-go: false
          cache-key: 1.26
          working-directory: ./
